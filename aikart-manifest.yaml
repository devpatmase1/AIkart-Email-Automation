apiVersion: aikart.dev/v1
kind: AgentManifest

metadata:
  name: aikart-emailautomation
  displayName: "LangGraph Customer Support Email Automation Agent"
  description: "AI-powered customer support agent built with LangGraph and RAG that categorizes emails, performs knowledge lookup, and drafts professional replies."

runtime:
  type: docker
  image: "devaikart/aikart-emailautomation:1.0.0"
  command: ["python", "aikart_runner.py"]

resources:
  cpu: 0.25
  memoryMb: 512
  timeoutSeconds: 120

inputs:
  - name: prompt
    label: "Customer Email Body / Support Query"
    type: textarea
    required: true
  - name: mode
    label: "Execution Mode"
    type: select
    required: false
    default: "inbox-process"
    options:
      - "inbox-process"
      - "rag-query"
      - "proofread"
  - name: model
    label: "LLM Model Provider"
    type: select
    required: false
    default: "gemini-2.0-flash"
    options:
      - "gemini-2.0-flash"
      - "llama-3.3-70b-versatile"

secrets:
  - name: GOOGLE_API_KEY
    description: "Google Gemini API Key for LLM reasoning and RAG vector search embeddings."
    required: true
  - name: MY_EMAIL
    description: "Sender Email Address for email responses."
    required: false
  - name: EMAIL_PASSWORD
    description: "Sender 16-character Google App Password or SMTP key."
    required: false

output:
  format: markdown

security:
  networkEgress: allowlist
  egressAllowlist:
    - generativelanguage.googleapis.com
    - googleapis.com
    - api.groq.com
    - api.resend.com
    - smtp.gmail.com
